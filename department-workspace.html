<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Workspace — CentralHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    /* Knowledge family — mor accent, canonical .page-hero in shared-styles.css. */
    .page-wrap {
      max-width: var(--container-max, 1200px);
      margin: 0 auto;
      padding: 24px 40px 56px;
    }

    /* === Picker landing === */
    .dw-pick-context {
      font-size: 0.92rem;
      color: var(--ink-2);
      margin: 4px 4px 18px;
      line-height: 1.55;
    }
    .dw-pick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 26px;
    }
    .dw-pick-card {
      display: flex; gap: 12px; align-items: center;
      padding: 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform .14s, box-shadow .14s, border-color .14s;
      position: relative;
    }
    .dw-pick-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(15,23,42,0.06);
      border-color: #c4b5fd;
    }
    .dw-pick-card--mine {
      border-color: #c4b5fd;
      background: linear-gradient(180deg, #faf8ff 0%, var(--white) 60%);
    }
    .dw-pick-card--mine::after {
      content: "★ Yours";
      position: absolute;
      top: 8px; right: 10px;
      font-size: 0.66rem; font-weight: 700;
      color: #6d28d9;
      letter-spacing: 0.04em;
    }
    .dw-pick-badge {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 0.92rem;
      font-family: 'DM Mono', monospace;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(15,23,42,0.12);
      position: relative;
      overflow: hidden;
    }
    .dw-pick-badge::before {
      /* subtle inner sheen for premium feel */
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 80% at 100% 0%, rgba(255,255,255,0.22) 0%, transparent 60%);
      pointer-events: none;
    }
    .dw-pick-emoji {
      font-size: 1.55rem;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.18));
      position: relative; /* sit above the ::before sheen */
    }
    .dw-pick-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .dw-pick-name {
      font-family: 'Lora', serif;
      font-size: 1rem; font-weight: 600;
      color: var(--ink);
    }
    .dw-pick-chip {
      font-size: 0.66rem; font-weight: 600;
      padding: 2px 8px;
      border-radius: 9px;
      align-self: flex-start;
      letter-spacing: 0.02em;
    }
    .dw-pick-chip--write { background: #ede9fe; color: #5b21b6; }
    .dw-pick-chip--read { background: var(--paper-2); color: var(--ink-3); }
    .dw-pick-footnote {
      font-size: 0.82rem;
      color: var(--ink-3);
      line-height: 1.6;
      padding: 14px 16px;
      background: var(--paper);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }
    .dw-pick-footnote a { color: var(--accent); text-decoration: none; }
    .dw-pick-footnote a:hover { text-decoration: underline; }

    /* === Subject head === */
    .dw-subject-head { margin-bottom: 18px; }
    .dw-back {
      display: inline-flex; align-items: center;
      font-size: 0.82rem;
      color: var(--ink-3);
      text-decoration: none;
      margin-bottom: 14px;
    }
    .dw-back:hover { color: var(--accent); }
    .dw-subject-id-row {
      display: flex; align-items: center; gap: 14px;
    }
    .dw-subject-badge {
      width: 60px; height: 60px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 1.85rem;
      font-family: 'DM Mono', monospace;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(15,23,42,0.16);
      position: relative;
      overflow: hidden;
      line-height: 1;
    }
    .dw-subject-badge::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 80% at 100% 0%, rgba(255,255,255,0.22) 0%, transparent 60%);
      pointer-events: none;
    }
    .dw-subject-badge > * { position: relative; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.18)); }
    .dw-subject-title {
      font-family: 'Lora', serif;
      font-size: 1.45rem; font-weight: 600;
      color: var(--ink); line-height: 1.2;
      margin: 0;
    }
    .dw-subject-sub { margin-top: 4px; }
    .dw-write-badge {
      font-size: 0.7rem; font-weight: 600;
      padding: 3px 9px;
      border-radius: 10px;
      letter-spacing: 0.02em;
    }
    .dw-write-badge--yes { background: #d1fae5; color: #047857; }
    .dw-write-badge--no { background: var(--paper-2); color: var(--ink-3); }

    /* === Sections === */
    .dw-section {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }
    .dw-section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .dw-section-title {
      font-family: 'Lora', serif;
      font-size: 1.12rem; font-weight: 600;
      color: var(--ink); margin: 0;
    }
    .dw-section-mode {
      font-size: 0.7rem; font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .dw-loading {
      color: var(--ink-3);
      font-size: 0.86rem;
      padding: 14px 0;
    }
    .dw-empty {
      padding: 18px 20px;
      background: var(--paper);
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--ink-3);
      font-size: 0.86rem;
      line-height: 1.5;
    }
    .dw-empty a { color: var(--accent); text-decoration: none; }
    .dw-empty a:hover { text-decoration: underline; }
    .dw-empty-title {
      font-weight: 600; color: var(--ink-2); margin-bottom: 4px;
    }
    .dw-empty-desc { font-size: 0.84rem; }

    /* === KPI strip === */
    .dw-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .dw-kpi {
      padding: 14px 16px;
      background: linear-gradient(180deg, #faf8ff 0%, var(--white) 70%);
      border: 1px solid #ede9fe;
      border-radius: 10px;
    }
    .dw-kpi-lbl {
      font-size: 0.7rem; font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .dw-kpi-val {
      font-family: 'DM Mono', monospace;
      font-size: 1.45rem; font-weight: 600;
      color: var(--ink);
      line-height: 1.1;
    }
    .dw-kpi-sub {
      font-size: 0.74rem;
      color: var(--ink-3);
      margin-top: 4px;
    }

    /* === Annual Plan two-block (Pacing strip + Strategy artifact) === */
    .dw-pacing-block { margin-bottom: 14px; }
    .dw-strategy-block { }
    .dw-block-lbl {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.72rem; font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .dw-block-lbl-icon { font-size: 0.95rem; }
    .dw-block-lbl-hint {
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.7rem;
      color: var(--ink-3);
      opacity: 0.75;
      margin-left: 6px;
    }
    .dw-pacing-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .dw-pacing-link {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 9px;
      text-decoration: none;
      color: var(--ink);
      transition: border-color .14s, transform .12s, box-shadow .14s, background .14s;
    }
    .dw-pacing-link:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(124,58,237,0.10);
      background: #faf8ff;
    }
    .dw-pacing-stage {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem; font-weight: 600;
      color: var(--accent);
      background: #ede9fe;
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .dw-pacing-label {
      font-size: 0.88rem;
      font-weight: 500;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dw-pacing-arrow {
      color: var(--ink-3);
      flex-shrink: 0;
      transition: color .14s, transform .12s;
    }
    .dw-pacing-link:hover .dw-pacing-arrow {
      color: var(--accent);
      transform: translateX(2px);
    }
    .dw-pacing-empty {
      padding: 12px 14px;
      background: var(--paper);
      border: 1px dashed var(--border);
      border-radius: 9px;
      font-size: 0.84rem;
      color: var(--ink-3);
      line-height: 1.5;
    }

    /* === Artifact card === */
    .dw-artifact-card {
      padding: 14px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .dw-artifact-row {
      display: flex; gap: 14px; align-items: flex-start;
    }
    .dw-artifact-icon {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: var(--white);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .dw-artifact-main { flex: 1; min-width: 0; }
    .dw-artifact-title {
      font-weight: 600; color: var(--ink);
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .dw-artifact-meta {
      display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap;
      font-size: 0.74rem; color: var(--ink-3);
    }
    .dw-artifact-summary {
      margin-top: 8px;
      font-size: 0.86rem;
      color: var(--ink-2);
      line-height: 1.5;
    }
    .dw-artifact-when { font-size: 0.74rem; }
    .dw-artifact-actions {
      display: flex; gap: 6px;
      flex-shrink: 0;
    }
    .dw-pill {
      padding: 1px 8px;
      border-radius: 9px;
      font-size: 0.66rem; font-weight: 600;
      background: var(--paper-2);
      color: var(--ink-3);
    }
    .dw-pill--draft { background: #fef3c7; color: #92400e; }
    .dw-pill--current { background: #d1fae5; color: #065f46; }
    .dw-pill--archived { background: #e5e7eb; color: #4b5563; }
    .dw-artifact-versions {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .dw-artifact-versions-lbl {
      font-size: 0.7rem; font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .dw-version-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .dw-version-list li {
      display: flex; gap: 8px; align-items: center;
      font-size: 0.82rem; color: var(--ink-2);
    }
    .dw-version-title { color: var(--ink-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* === Leaders grid === */
    .dw-leaders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .dw-leader-card {
      padding: 12px 14px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .dw-leader-school {
      font-size: 0.72rem; font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .dw-leader-name {
      font-weight: 600; color: var(--ink);
      font-size: 0.92rem;
      margin-bottom: 2px;
    }
    .dw-leader-position {
      font-size: 0.78rem;
      color: var(--ink-3);
      margin-bottom: 6px;
    }
    .dw-leader-contact {
      display: flex; flex-direction: column; gap: 2px;
      font-size: 0.78rem;
    }
    .dw-leader-email { color: var(--accent); text-decoration: none; }
    .dw-leader-email:hover { text-decoration: underline; }
    .dw-leader-phone { color: var(--ink-3); font-family: 'DM Mono', monospace; }

    /* === Notes editor === */
    .dw-notes-readonly {
      padding: 14px 16px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .dw-notes-body {
      font-size: 0.92rem;
      color: var(--ink);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .dw-notes-meta {
      margin-top: 10px;
      font-size: 0.74rem;
      color: var(--ink-3);
    }
    .dw-notes-textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--ink);
      background: var(--paper);
      resize: vertical;
      min-height: 160px;
      line-height: 1.55;
    }
    .dw-notes-textarea:focus { outline: none; border-color: var(--accent); background: var(--white); }
    .dw-notes-foot {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .dw-notes-actions { display: flex; gap: 8px; }
    .dw-btn-primary {
      padding: 7px 14px;
      background: linear-gradient(135deg,#7c3aed,#0891b2);
      color: #fff; border: none;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.84rem; font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .12s;
    }
    .dw-btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .dw-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .dw-btn-secondary {
      padding: 7px 12px;
      background: var(--white);
      color: var(--ink-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem; font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .dw-btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* === Toast === */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink); color: #fff;
      padding: 10px 18px; border-radius: 8px;
      font-size: 0.86rem; font-weight: 500;
      z-index: 9999; opacity: 0;
      transition: all .25s; pointer-events: none;
      max-width: 460px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <script src="firebase-config.js"></script>
  <script type="module" src="auth-guard.js"></script>

  <!-- SHARED_NAVBAR -->

  <header class="page-hero" data-accent="mor" aria-label="Department workspace header">
    <div class="page-hero__inner">
      <div class="page-hero__text">
        <p class="page-hero__eyebrow">CentralHub · Coordinators Workspace</p>
        <h1 class="page-hero__title">Department Workspace</h1>
        <p class="page-hero__desc">A subject-scoped lens onto Annual Plan, school subject leaders, and your running list of items to raise with school subject leaders — one canvas per department.</p>
      </div>
    </div>
  </header>

  <div class="page-wrap">
    <div id="workspaceRoot">
      <div class="dw-loading">Loading…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initDepartmentWorkspace } from './partials/department-core.js';
    // CH auth-guard dispatches authReady on `document` (Common Mistake #13).
    // Module scripts evaluate asynchronously, so the event may have already
    // fired before we attach the listener — guard against the race by
    // checking window.currentUser too.
    function safeInit() {
      try { initDepartmentWorkspace(); }
      catch (err) {
        console.error('[department-workspace init]', err);
        const host = document.getElementById('workspaceRoot');
        if (host) host.innerHTML = '<div class="dw-empty"><div class="dw-empty-title">Could not start workspace.</div><div class="dw-empty-desc">' + String(err && (err.message || err)) + '</div></div>';
      }
    }
    if (window.currentUser && window.userProfile && window.db) {
      safeInit();
    } else {
      document.addEventListener('authReady', safeInit, { once: true });
    }
  </script>
</body>
</html>
